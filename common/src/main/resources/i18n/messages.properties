devutils.regex.accuracy.JAVASCRIPT.tooltip=JavaScript patterns are validated, then translated to java.util.regex with semantic corrections (^ $ . \\s, flags i m s u v y). Known limitations:\n• Unbounded-length lookbehind (e.g. (?<=a+)) is not supported.\n• A backreference to a group that has not participated fails, whereas in JavaScript it matches the empty string.\n• \\q{...} with the v flag is not supported.
devutils.regex.accuracy.PHP.tooltip=PCRE patterns are validated, then translated to java.util.regex (group names, backreferences, POSIX classes, modifiers U D A u). PCRE features without an equivalent are rejected with a clear message:\n• \\K (reset match start)\n• Recursion and subroutines: (?R) (?1) (?&name)\n• Conditionals (?(1)...|...)\n• Branch reset (?|...)\n• Verbs (*SKIP) (*FAIL) and the like\n• \\C (single byte)\n• Inline flags J and n

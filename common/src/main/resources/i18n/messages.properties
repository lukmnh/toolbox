devutils.cron.reference=Field & special character reference
devutils.cron.reference.UNIX=minute 0–59 · hour 0–23 · day-of-month 1–31 · month 1–12 / JAN–DEC · day-of-week 0–7 / SUN–SAT\nCharacters: * , - /\nMacros: @yearly @annually @monthly @weekly @daily @midnight @hourly @reboot\nWhen both day-of-month and day-of-week are set: runs when EITHER matches.
devutils.cron.reference.SPRING=second 0–59 · minute 0–59 · hour 0–23 · day-of-month 1–31 · month 1–12 / JAN–DEC · day-of-week 0–7 / MON–SUN\nCharacters: * , - / and ? (same as *)\nDay-of-month: L, L-3, LW, 15W · Day-of-week: 5L, FRI#2\nMacros: @yearly @annually @monthly @weekly @daily @midnight @hourly\nWhen both day-of-month and day-of-week are set: runs when BOTH match.
devutils.cron.reference.QUARKUS=second 0–59 · minute 0–59 · hour 0–23 · day-of-month 1–31 · month 1–12 / JAN–DEC · day-of-week 1–7 / SUN–SAT (1 = Sunday) · optional year\nCharacters: * , - / and ? (required in day-of-month OR day-of-week)\nDay-of-month: L, L-3, LW, 15W · Day-of-week: 6L, 6#3\nNo macros. Quarkus uses this format by default (quarkus.scheduler.cron-type=quartz).
devutils.cron.reference.GO=[second 0–59] · minute 0–59 · hour 0–23 · day-of-month 1–31 · month 1–12 / JAN–DEC · day-of-week 0–6 / SUN–SAT\nCharacters: * , - / and ? (same as *) · no L, W, #\nMacros: @yearly @annually @monthly @weekly @daily @midnight @hourly · @every 1h30m\nZone prefix: CRON_TZ=Asia/Jakarta · When both day-of-month and day-of-week are set: runs when EITHER matches.
devutils.cron.reference.LARAVEL=minute 0–59 · hour 0–23 · day-of-month 1–31 · month 1–12 / JAN–DEC · day-of-week 0–7 / SUN–SAT\nCharacters: * , - / and ? (same as *)\nDay-of-month: L, 15W · Day-of-week: 5L, 5#2\nMacros: @yearly @annually @monthly @weekly @daily @midnight @hourly\nWhen both day-of-month and day-of-week are set: runs when EITHER matches.
devutils.cron.reference.common=*/15 = every 15 · 8-17 = range · 1,15 = list · 5/10 = starting at 5, then every 10.

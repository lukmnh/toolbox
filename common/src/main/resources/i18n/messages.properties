devutils.cron.name=Cron Builder & Explainer
devutils.cron.description=Build and explain cron expressions for Unix, Spring, Quarkus/Quartz, Go, and Laravel, with the next 10 run times.
devutils.cron.hint=Choose a target, then build with the Builder or paste an expression. Validation, explanation, and schedule follow the rules of the selected platform.
devutils.cron.target=Target
devutils.cron.target.hint.UNIX=5 fields: minute hour day-of-month month day-of-week. Day of week 0–7 (0 and 7 = Sunday). Used by Linux crontab, Kubernetes CronJob, GitHub Actions.
devutils.cron.target.hint.SPRING=6 fields (seconds first): Spring 5.3+ / Boot 2.4+ @Scheduled. Day of week 0–7 or MON–SUN; supports L, W, and #.
devutils.cron.target.hint.QUARKUS=6–7 fields (seconds first, optional year): Quartz, the Quarkus default. Day of week 1–7 with 1 = Sunday; either day-of-month or day-of-week must be ?.
devutils.cron.target.hint.GO=robfig/cron v3: 5 fields (6 with cron.WithSeconds). Day of week 0–6, no L/W/#. Supports @every 1h30m and the CRON_TZ= prefix.
devutils.cron.target.hint.LARAVEL=Laravel scheduler (dragonmantank/cron-expression): 5 fields. Day of week 0–7; supports L and 15W in day-of-month, 5L and 5#2 in day-of-week.

devutils.sql.sheet.showIsolation.title=Show the current isolation level
devutils.sql.sheet.forUpdate.title=SELECT … FOR UPDATE (pessimistic lock)
devutils.sql.sheet.forShare.title=SELECT … FOR SHARE
devutils.sql.sheet.nowait.title=FOR UPDATE NOWAIT
devutils.sql.sheet.skipLocked.title=FOR UPDATE SKIP LOCKED (job queue)
devutils.sql.sheet.optimistic.title=Optimistic locking (version column)
devutils.sql.sheet.atomicUpdate.title=Atomic conditional UPDATE
devutils.sql.sheet.lockTable.title=LOCK TABLE
devutils.sql.sheet.advisoryLock.title=Advisory lock
devutils.sql.sheet.deadlockExample.title=How a deadlock happens
devutils.sql.sheet.lockOrder.title=Prevent: lock rows in a fixed order
devutils.sql.sheet.lockTimeout.title=lock_timeout / deadlock_timeout
devutils.sql.sheet.findBlocking.title=Find blocking sessions (PostgreSQL)
devutils.sql.sheet.innodbStatus.title=Last deadlock details (MySQL)
devutils.sql.sheet.explainPlan.title=EXPLAIN
devutils.sql.sheet.explainAnalyze.title=EXPLAIN ANALYZE
devutils.sql.sheet.explainBuffers.title=EXPLAIN (ANALYZE, BUFFERS)
devutils.sql.sheet.explainDml.title=EXPLAIN ANALYZE on writes, safely
devutils.sql.sheet.readPlan.title=Reading a plan
devutils.sql.sheet.explainMysql.title=EXPLAIN in MySQL
devutils.sql.sheet.analyzeStats.title=ANALYZE (refresh statistics)
devutils.sql.sheet.firstNf.title=First normal form (1NF)
devutils.sql.sheet.secondNf.title=Second normal form (2NF)
devutils.sql.sheet.thirdNf.title=Third normal form (3NF)
devutils.sql.sheet.denormCounter.title=Denormalize: stored counter
devutils.sql.sheet.denormSnapshot.title=Denormalize: snapshot value
devutils.sql.sheet.materializedView.title=Denormalize: materialized view
devutils.sql.sheet.rangePartition.title=PARTITION BY RANGE
devutils.sql.sheet.listPartition.title=PARTITION BY LIST
devutils.sql.sheet.hashPartition.title=PARTITION BY HASH
devutils.sql.sheet.defaultPartition.title=DEFAULT partition
devutils.sql.sheet.dropPartition.title=DETACH / DROP partition (retention)
devutils.sql.sheet.pruning.title=Partition pruning
devutils.sql.sheet.shardKey.title=Shard key in the schema
devutils.sql.sheet.hashRouting.title=Hash routing
devutils.sql.sheet.singleShardQuery.title=Single-shard query
devutils.sql.sheet.crossShardQuery.title=Cross-shard query (scatter-gather)
devutils.sql.sheet.citus.title=Citus distributed tables
devutils.sql.group.acid=ACID & transactions
devutils.sql.group.acid.intro=A transaction groups statements so they succeed or fail as one unit. ACID:\n• Atomicity: all statements commit, or none do (ROLLBACK undoes everything).\n• Consistency: constraints (PK, FK, CHECK, UNIQUE) hold before and after every transaction.\n• Isolation: concurrent transactions do not see each other's half-finished work (how much depends on the isolation level).\n• Durability: once COMMIT returns, the data survives a crash (write-ahead log / redo log).\nKeep transactions short: a long open transaction holds locks and blocks cleanup (VACUUM / purge).
devutils.sql.group.isolation=Transaction isolation
devutils.sql.group.isolation.intro=The isolation level decides which anomalies a transaction can see from other concurrent transactions.\n• Dirty read: reading data another transaction has not committed yet.\n• Non-repeatable read: reading the same row twice gives different values.\n• Phantom read: running the same filter twice returns new rows.\n• Lost update / write skew: two transactions read, decide, then write, and one silently overwrites the other.\n\nWhat each level prevents:\n• READ UNCOMMITTED: nothing; dirty, non-repeatable, and phantom reads are all possible.\n• READ COMMITTED: dirty reads.\n• REPEATABLE READ: dirty and non-repeatable reads; phantoms per the standard, but PostgreSQL and InnoDB snapshots also hide most phantoms.\n• SERIALIZABLE: all of them, including write skew.\n\nDefaults: PostgreSQL, Oracle, SQL Server = READ COMMITTED; MySQL InnoDB = REPEATABLE READ. Higher levels are safer but cause more waits or serialization errors that the application must retry.
devutils.sql.group.locking=Locking
devutils.sql.group.locking.intro=Locks stop two transactions from changing the same data in conflicting ways.\n• Row locks (FOR UPDATE, FOR SHARE) are taken by SELECT … FOR … and by every UPDATE/DELETE, and are released at COMMIT or ROLLBACK.\n• Pessimistic locking: lock first, then read and write. Good when conflicts are frequent.\n• Optimistic locking: no lock while reading; the UPDATE checks a version column and the app retries when 0 rows change. Good when conflicts are rare or the user think-time is long.\n• Table locks and DDL (ALTER TABLE) block much more; run them in quiet hours or with lock_timeout.\nReaders do not block writers in MVCC databases (PostgreSQL, InnoDB, Oracle): a plain SELECT takes no row lock.
devutils.sql.group.deadlock=Deadlocks
devutils.sql.group.deadlock.intro=A deadlock happens when transaction A waits for a lock held by B while B waits for a lock held by A. The database detects the cycle and aborts one of them (PostgreSQL: "deadlock detected", MySQL: error 1213).\nHow to prevent:\n• Always lock rows in the same order (e.g. ORDER BY id before FOR UPDATE).\n• Keep transactions short and do not wait for user input or HTTP calls inside them.\n• Touch fewer rows per transaction; add indexes so UPDATE/DELETE do not lock extra rows while scanning.\n• Retry the aborted transaction in the application: a deadlock is expected under load, not a crash.
devutils.sql.group.explain=EXPLAIN & EXPLAIN ANALYZE
devutils.sql.group.explain.intro=EXPLAIN shows the plan the optimizer picked without running the query. EXPLAIN ANALYZE runs the query and adds real timings and row counts.\nHow to read a plan:\n• Read from the most indented node outwards: the innermost nodes run first.\n• cost=start..total is a relative estimate, not milliseconds. actual time is in milliseconds per loop.\n• Compare rows (estimate) with actual rows: a big gap means stale statistics; run ANALYZE.\n• Seq Scan on a large table with a selective WHERE usually means a missing or unusable index.\n• Nested Loop with many loops, a Sort spilling to disk, or a Hash using batches are common hot spots.\nCaution: EXPLAIN ANALYZE really executes the statement, including INSERT/UPDATE/DELETE.
devutils.sql.group.normalization=Normalization vs denormalization
devutils.sql.group.normalization.intro=Normalization stores each fact once so updates cannot create contradictions. Denormalization copies or precomputes data so reads are faster.\n\nNormalized vs denormalized:\n• Writes: one place to update vs every copy must be updated.\n• Reads: more joins vs fewer joins and faster.\n• Consistency: guaranteed by design vs kept by code, triggers, or jobs.\n• Storage: smaller vs larger.\n• Fits: OLTP and the source of truth vs reporting, read-heavy pages, and caches.\n\nRule of thumb: normalize to 3NF first, then denormalize only a measured slow read, and document how each copy stays in sync.
devutils.sql.group.partition=Partitioning
devutils.sql.group.partition.intro=Partitioning splits one large table into smaller physical tables inside the same database. Queries still use the parent table.\n• RANGE: by time or number ranges (logs, events, orders by month).\n• LIST: by discrete values (region, tenant type).\n• HASH: spreads rows evenly when there is no natural range.\nBenefits: partition pruning skips partitions that cannot match the WHERE, and old data is removed by dropping a partition instead of a slow DELETE.\nCosts: the partition key must be in every primary key and unique index, and queries that do not filter on the key scan every partition. Worth it for tables of tens of millions of rows or with clear retention rules.
devutils.sql.group.sharding=Sharding
devutils.sql.group.sharding.intro=Sharding splits data across several database servers. Each shard holds a subset of rows chosen by a shard key, so writes and storage scale out beyond one machine.\nPartitioning vs sharding: partitions live in one database (one server, one transaction scope); shards live in different databases (independent servers).\nChoosing the shard key:\n• High cardinality and even spread (tenant_id, user_id), so no shard becomes hot.\n• Present in almost every query, so a query hits one shard.\n• Rows that are joined together share the key (co-location).\nCosts: cross-shard joins, aggregations, and transactions are slow or need two-phase commit, unique constraints only hold per shard, and resharding is hard. Try indexes, read replicas, caching, and partitioning first.
devutils.sql.sheet.transaction=Move money atomically: both updates commit, or neither does. MySQL also accepts START TRANSACTION.
devutils.sql.sheet.transaction.when=Any change that spans several statements or rows and must stay consistent.
devutils.sql.sheet.rollback=Undo every change made since BEGIN.
devutils.sql.sheet.rollback.when=Errors in the application, failed validation, or trying a risky statement safely.
devutils.sql.sheet.savepoint=Roll back part of a transaction and continue with the rest.
devutils.sql.sheet.savepoint.when=Optional steps inside a larger transaction, or retrying one step without losing earlier work.
devutils.sql.sheet.consistency=Consistency is enforced by constraints: a transaction that breaks them fails and is rolled back.
devutils.sql.sheet.consistency.when=Invariants that must never break (no negative balance, valid status).
devutils.sql.sheet.readUncommitted=Can read data other transactions have not committed (dirty reads). PostgreSQL treats it as READ COMMITTED.
devutils.sql.sheet.readUncommitted.when=Almost never. Only rough monitoring queries where wrong numbers are acceptable.
devutils.sql.sheet.readCommitted=Each statement sees only data committed before it started. Two statements in one transaction may see different data.
devutils.sql.sheet.readCommitted.when=Default for most web apps. Combine with FOR UPDATE or atomic UPDATE for read-then-write logic.
devutils.sql.sheet.repeatableRead=The whole transaction sees one snapshot. In PostgreSQL a conflicting write fails with a serialization error.
devutils.sql.sheet.repeatableRead.when=Reports and exports that must be consistent across many queries, and multi-step logic over the same rows.
devutils.sql.sheet.serializable=Result is as if transactions ran one after another. Prevents write skew; conflicts fail and must be retried.
devutils.sql.sheet.serializable.when=Rules across several rows (at least one doctor on call, no double booking) when locking is hard to get right.
devutils.sql.sheet.showIsolation=Show the isolation level of the current session.
devutils.sql.sheet.showIsolation.when=Checking what the driver or connection pool actually uses.
devutils.sql.sheet.forUpdate=Pessimistic lock: lock the row while reading it; other writers wait until COMMIT.
devutils.sql.sheet.forUpdate.when=Read-modify-write on hot rows: balance, stock, seat booking.
devutils.sql.sheet.forShare=Shared lock: others can read and share-lock, but cannot update or delete the row until you finish.
devutils.sql.sheet.forShare.when=Making sure a parent row does not change or disappear while you insert children that depend on it.
devutils.sql.sheet.nowait=Fail immediately instead of waiting when the row is already locked.
devutils.sql.sheet.nowait.when=Interactive actions where waiting is worse than "please try again" (seat or ticket picking).
devutils.sql.sheet.skipLocked=Skip rows locked by others and take the next free ones (PostgreSQL 9.5+, MySQL 8.0+).
devutils.sql.sheet.skipLocked.when=Job queues with several workers: each worker claims different jobs without blocking.
devutils.sql.sheet.optimistic=Optimistic lock: update only if the version is still the one you read. 0 rows changed = someone else won; reload and retry.
devutils.sql.sheet.optimistic.when=Forms and long edits where holding a lock is impossible, and conflicts are rare (JPA @Version works this way).
devutils.sql.sheet.atomicUpdate=Do the check and the change in one statement; the row lock makes it safe without SELECT first.
devutils.sql.sheet.atomicUpdate.when=Counters and stock decrements. Simplest and fastest fix for lost updates.
devutils.sql.sheet.lockTable=Lock a whole table (PostgreSQL modes from ACCESS SHARE to ACCESS EXCLUSIVE; MySQL: LOCK TABLES … WRITE).
devutils.sql.sheet.lockTable.when=Rare bulk operations that must not run alongside other writes. Prefer row locks in normal code.
devutils.sql.sheet.advisoryLock=Application-defined lock on a number, released at the end of the transaction (MySQL: GET_LOCK('name', 10)).
devutils.sql.sheet.advisoryLock.when=Making sure only one instance runs a cron job or migration, without locking any table.
devutils.sql.sheet.deadlockExample=Two transactions lock the same rows in opposite order. Each waits for the other, so the database aborts one.
devutils.sql.sheet.deadlockExample.when=Recognize this pattern in transfers, batch updates, and parent/child updates.
devutils.sql.sheet.lockOrder=Lock every row you need up front, in a fixed order. All transactions then queue instead of crossing.
devutils.sql.sheet.lockOrder.when=Transactions that update several rows of the same table (transfers, bulk status changes).
devutils.sql.sheet.lockTimeout=lock_timeout aborts a statement that waits too long for a lock; deadlock_timeout is how long PostgreSQL waits before checking for a deadlock (MySQL: innodb_lock_wait_timeout).
devutils.sql.sheet.lockTimeout.when=Migrations and DDL in production, so a blocked ALTER does not queue every other query behind it.
devutils.sql.sheet.findBlocking=List sessions that are waiting, and which process IDs block them (PostgreSQL).
devutils.sql.sheet.findBlocking.when=Investigating stuck queries or lock waits. End a blocker with SELECT pg_terminate_backend(pid).
devutils.sql.sheet.innodbStatus=Shows InnoDB internals, including the LATEST DETECTED DEADLOCK section with both statements (MySQL).
devutils.sql.sheet.innodbStatus.when=Analyzing the last deadlock on MySQL. Enable innodb_print_all_deadlocks to log every one.
devutils.sql.sheet.explainPlan=Show the estimated plan without running the query.
devutils.sql.sheet.explainPlan.when=Quick check whether an index is used. Safe on production because nothing runs.
devutils.sql.sheet.explainAnalyze=Run the query and show real time and row counts for each step (MySQL 8.0.18+ also supports it).
devutils.sql.sheet.explainAnalyze.when=Finding why a query is slow: compare estimated rows with actual rows and look for the slowest node.
devutils.sql.sheet.explainBuffers=Also show buffer usage: shared hit = read from cache, read = from disk (PostgreSQL).
devutils.sql.sheet.explainBuffers.when=Telling apart a CPU-bound plan from one that is slow because of disk reads.
devutils.sql.sheet.explainDml=EXPLAIN ANALYZE really executes the statement, so wrap writes in a transaction and roll back.
devutils.sql.sheet.explainDml.when=Measuring UPDATE or DELETE plans without changing data.
devutils.sql.sheet.readPlan=Sample output: estimate rows=1 but actual rows=3, total 0.045 ms. Index Scan means the index was used; Seq Scan reads the whole table.
devutils.sql.sheet.readPlan.when=Reading plans: check node type, actual time, rows vs estimate, and loops (time × loops = real cost).
devutils.sql.sheet.explainMysql=Readable tree plan in MySQL 8.0+. The classic EXPLAIN table shows type (ALL = full scan, ref/range = index), key, and rows.
devutils.sql.sheet.explainMysql.when=Query tuning on MySQL.
devutils.sql.sheet.analyzeStats=Refresh table statistics that the optimizer uses for estimates (MySQL: ANALYZE TABLE orders).
devutils.sql.sheet.analyzeStats.when=After bulk loads or big deletes, or when estimates in EXPLAIN are far from actual rows.
devutils.sql.sheet.firstNf=1NF: one value per column and no repeating groups. A list in a column becomes its own table.
devutils.sql.sheet.firstNf.when=Any time a column holds comma-separated values or numbered columns (product1, product2…).
devutils.sql.sheet.secondNf=2NF: with a composite key, every non-key column depends on the whole key, not only part of it.
devutils.sql.sheet.secondNf.when=Tables with a composite primary key that also store details of one key part.
devutils.sql.sheet.thirdNf=3NF: non-key columns depend only on the key, not on other non-key columns.
devutils.sql.sheet.thirdNf.when=When changing one fact (a city name) requires updating many rows.
devutils.sql.sheet.denormCounter=Denormalized counter: store the count instead of COUNT(*) on every read. Update it in the same transaction.
devutils.sql.sheet.denormCounter.when=Read-heavy pages that show counts (likes, comments). Hot counters can become a lock bottleneck.
devutils.sql.sheet.denormSnapshot=Copy a value on purpose to keep history: the price at the time of purchase.
devutils.sql.sheet.denormSnapshot.when=Invoices, orders, and audit data, where the copy is correct even if the source changes later.
devutils.sql.sheet.materializedView=Store the result of a query and refresh it later. CONCURRENTLY keeps it readable during refresh (needs a unique index).
devutils.sql.sheet.materializedView.when=Dashboards and reports where slightly stale data is fine and the query is expensive.
devutils.sql.sheet.rangePartition=Partition by time range; each month is its own table (PostgreSQL declarative partitioning).
devutils.sql.sheet.rangePartition.when=Append-heavy time series: logs, events, audit trails with retention. Create future partitions ahead of time (cron or pg_partman).
devutils.sql.sheet.listPartition=Partition by a list of discrete values.
devutils.sql.sheet.listPartition.when=Data split by region, country, or category with different access patterns or storage.
devutils.sql.sheet.hashPartition=Spread rows evenly over N partitions by hashing the key.
devutils.sql.sheet.hashPartition.when=Large tables with no natural range, to reduce index size and VACUUM time per partition.
devutils.sql.sheet.defaultPartition=Catch rows that fit no other partition, so inserts do not fail.
devutils.sql.sheet.defaultPartition.when=Safety net for range or list partitions. Keep it small; attaching a new partition scans it.
devutils.sql.sheet.dropPartition=Remove old data instantly by detaching and dropping a partition instead of a DELETE.
devutils.sql.sheet.dropPartition.when=Data retention (keep 12 months). No table bloat and no long-running DELETE. CONCURRENTLY needs PostgreSQL 14+.
devutils.sql.sheet.pruning=Partition pruning: the plan should list only the partitions that can match the WHERE.
devutils.sql.sheet.pruning.when=Checking that queries filter on the partition key. Wrapping the key in a function can disable pruning.
devutils.sql.sheet.shardKey=Put the shard key in every sharded table and in the primary key, so related rows live on the same shard.
devutils.sql.sheet.shardKey.when=Multi-tenant SaaS (tenant_id) or per-user data (user_id) that has outgrown one server.
devutils.sql.sheet.hashRouting=Route each key to a shard with a hash. Plain modulo moves most keys when the shard count changes; consistent hashing or a lookup table avoids that.
devutils.sql.sheet.hashRouting.when=Application-level sharding when there is no middleware such as Vitess or Citus.
devutils.sql.sheet.singleShardQuery=A query that filters on the shard key goes to exactly one shard: fast and fully transactional.
devutils.sql.sheet.singleShardQuery.when=Design most queries like this. It is the main reason to pick a good shard key.
devutils.sql.sheet.crossShardQuery=No shard key in WHERE: the query must run on every shard and the results be merged (scatter-gather).
devutils.sql.sheet.crossShardQuery.when=Avoid in hot paths. Use it for admin reports, or copy the data to an analytics store.
devutils.sql.sheet.citus=Citus shards a PostgreSQL table by a column. Reference tables are copied to every node so joins stay local. MySQL equivalent: Vitess.
devutils.sql.sheet.citus.when=Scaling PostgreSQL horizontally without writing routing code in the application.

# ---------- Dev Utils: cron ----------
devutils.cron.name=Cron Builder & Explainer
devutils.cron.description=Build and explain cron expressions for Unix, Spring, Quarkus/Quartz, Go, and Laravel, with the next 10 run times.
devutils.cron.hint=Choose a target, then build with the Builder or paste an expression. Validation, explanation, and schedule follow the rules of the selected platform.
devutils.cron.target=Target
devutils.cron.target.hint.UNIX=5 fields: minute hour day-of-month month day-of-week. Day of week 0–7 (0 and 7 = Sunday). Used by Linux crontab, Kubernetes CronJob, GitHub Actions.
devutils.cron.target.hint.SPRING=6 fields (seconds first): Spring 5.3+ / Boot 2.4+ @Scheduled. Day of week 0–7 or MON–SUN; supports L, W, and #.
devutils.cron.target.hint.QUARKUS=6–7 fields (seconds first, optional year): Quartz, the Quarkus default. Day of week 1–7 with 1 = Sunday; either day-of-month or day-of-week must be ?.
devutils.cron.target.hint.GO=robfig/cron v3: 5 fields (6 with cron.WithSeconds). Day of week 0–6, no L/W/#. Supports @every 1h30m and the CRON_TZ= prefix.
devutils.cron.target.hint.LARAVEL=Laravel scheduler (dragonmantank/cron-expression): 5 fields. Day of week 0–7; supports L and 15W in day-of-month, 5L and 5#2 in day-of-week.
devutils.cron.goSeconds=Use seconds (WithSeconds)
devutils.cron.goSeconds.tooltip=Check this if the scheduler is created with cron.New(cron.WithSeconds()): the first field becomes seconds.
devutils.cron.zone=Time zone
devutils.cron.builder=Builder

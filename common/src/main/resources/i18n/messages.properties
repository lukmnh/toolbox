devutils.sql.sheet.select.title=SELECT … WHERE
devutils.sql.sheet.select=Pick columns from a table and filter rows with WHERE.
devutils.sql.sheet.select.when=Every read. List only the columns you need instead of SELECT *, so covering indexes work and less data is sent.
devutils.sql.sheet.whereOperators.title=AND / OR / NOT, comparison operators
devutils.sql.sheet.whereOperators=Combine conditions. AND binds tighter than OR, so always put parentheses around OR groups. <> and != both mean "not equal".
devutils.sql.sheet.whereOperators.when=Any filter with more than one condition. Missing parentheses around OR is a classic bug that returns too many rows.
devutils.sql.sheet.alias.title=Aliases (AS)
devutils.sql.sheet.alias=Rename a column or table in the query. Table aliases keep joins short.
devutils.sql.sheet.alias.when=Joins, calculated columns, and API results that need stable column names. A column alias cannot be used in WHERE of the same query (use a subquery or repeat the expression).
devutils.sql.sheet.orderLimit.title=ORDER BY … LIMIT / OFFSET
devutils.sql.sheet.orderLimit=Sort, then return one page of rows. OFFSET skips rows (MySQL also accepts LIMIT 40, 20). Without ORDER BY the row order is not guaranteed.
devutils.sql.sheet.orderLimit.when=Small tables or the first few pages. Large OFFSETs get slow because skipped rows are still read; use keyset pagination instead.
devutils.sql.sheet.fetchFirst.title=OFFSET … FETCH FIRST (standard, SQL Server, Oracle)
devutils.sql.sheet.fetchFirst=Standard SQL pagination. Works in PostgreSQL, Oracle 12c+, and SQL Server 2012+ (SQL Server requires ORDER BY).
devutils.sql.sheet.fetchFirst.when=SQL Server and Oracle, which do not support LIMIT.
devutils.sql.sheet.keyset.title=Keyset pagination
devutils.sql.sheet.keyset=Continue after the last row of the previous page instead of skipping rows. The (a, b) < (x, y) row comparison works in PostgreSQL and MySQL.
devutils.sql.sheet.keyset.when=Infinite scroll, APIs, exports, and large tables. Needs an index on (created_at, id); id breaks ties.
devutils.sql.sheet.distinct.title=DISTINCT
devutils.sql.sheet.distinct=Remove duplicate rows from the result.
devutils.sql.sheet.distinct.when=Listing unique values. If you need DISTINCT to fix duplicates caused by a join, fix the join (or use EXISTS) instead.
devutils.sql.sheet.distinctOn.title=DISTINCT ON (PostgreSQL)
devutils.sql.sheet.distinctOn=Keep the first row per customer_id, using the ORDER BY to decide which row is first.
devutils.sql.sheet.distinctOn.when=Latest row per group in PostgreSQL. Elsewhere use ROW_NUMBER().
devutils.sql.sheet.betweenIn.title=BETWEEN / IN
devutils.sql.sheet.betweenIn=BETWEEN is an inclusive range; IN matches any value in a list.
devutils.sql.sheet.betweenIn.when=Number ranges and short value lists. For timestamps use >= start AND < end, because BETWEEN includes the end moment.
devutils.sql.sheet.like.title=LIKE / ILIKE
devutils.sql.sheet.like=Pattern match: % = any characters, _ = exactly one character. ILIKE is case-insensitive (PostgreSQL); MySQL LIKE is already case-insensitive with the default collation.
devutils.sql.sheet.like.when=Simple text search. 'abc%' can use an index, '%abc' cannot; use full-text search for real search features.
devutils.sql.sheet.isNull.title=IS NULL / IS NOT NULL
devutils.sql.sheet.isNull=Test for NULL. = NULL never matches because NULL means "unknown".
devutils.sql.sheet.isNull.when=Optional columns and soft-deleted rows.
devutils.sql.sheet.nullsOrder.title=NULLS FIRST / NULLS LAST
devutils.sql.sheet.nullsOrder=Choose where NULLs go when sorting (PostgreSQL, Oracle). PostgreSQL puts NULLs last for ASC by default; MySQL puts them first.
devutils.sql.sheet.nullsOrder.when=Task lists, due dates, and rankings where empty values should go to the end.
devutils.sql.sheet.cast.title=CAST / type conversion
devutils.sql.sheet.cast=Convert a value to another type. value::type is the PostgreSQL short form.
devutils.sql.sheet.cast.when=Comparing text with numbers or dates, and API parameters that arrive as text. Casting the column (not the parameter) in WHERE prevents index use.
devutils.sql.sheet.math.title=ROUND / CEIL / FLOOR / integer division
devutils.sql.sheet.math=Rounding functions. Integer divided by integer gives an integer in PostgreSQL and SQL Server (7 / 2 = 3); MySQL returns 3.5.
devutils.sql.sheet.math.when=Money, percentages, and averages. Store money as NUMERIC/DECIMAL, never FLOAT.
devutils.sql.sheet.case.title=CASE WHEN (searched CASE)
devutils.sql.sheet.case=if / else if / else inside a query. The first true WHEN wins; without ELSE the result is NULL.
devutils.sql.sheet.case.when=Labels, buckets, and any value that depends on a condition.
devutils.sql.sheet.caseSimple.title=CASE value WHEN (simple CASE)
devutils.sql.sheet.caseSimple=Compare one expression with several values, like a switch statement.
devutils.sql.sheet.caseSimple.when=Mapping codes to labels. Note: CASE x WHEN NULL never matches; use CASE WHEN x IS NULL.
devutils.sql.sheet.caseOrderBy.title=CASE in ORDER BY (custom sort)
devutils.sql.sheet.caseOrderBy=Sort by a custom order instead of alphabetical.
devutils.sql.sheet.caseOrderBy.when=Priorities, statuses, and any business order that is not alphabetical or numeric.
devutils.sql.sheet.casePivot.title=CASE inside SUM / COUNT (pivot)
devutils.sql.sheet.casePivot=Conditional aggregates: one pass over the table, one column per condition. COUNT ignores NULL, so CASE without ELSE counts only matches.
devutils.sql.sheet.casePivot.when=Reports with several totals per row (paid vs cancelled), on every database.
devutils.sql.sheet.caseWhere.title=Optional filter (parameter may be NULL)
devutils.sql.sheet.caseWhere=Apply a filter only when the parameter is given. Shorter form: WHERE (:category_id IS NULL OR category_id = :category_id).
devutils.sql.sheet.caseWhere.when=Search screens with optional filters. For big tables, build the WHERE dynamically in code so each variant gets a good plan.
devutils.sql.sheet.coalesce.title=COALESCE
devutils.sql.sheet.coalesce=Return the first value that is not NULL.
devutils.sql.sheet.coalesce.when=Fallback values for display and calculations where NULL would make the whole result NULL (NULL + 1 = NULL).
devutils.sql.sheet.nullif.title=NULLIF (avoid division by zero)
devutils.sql.sheet.nullif=Return NULL when both arguments are equal. x / NULLIF(y, 0) gives NULL instead of a division-by-zero error.
devutils.sql.sheet.nullif.when=Ratios and averages where the divisor can be 0, and turning empty strings into NULL: NULLIF(name, '').
devutils.sql.sheet.greatestLeast.title=GREATEST / LEAST
devutils.sql.sheet.greatestLeast=Largest or smallest of several values in the same row. PostgreSQL ignores NULLs; MySQL returns NULL if any argument is NULL.
devutils.sql.sheet.greatestLeast.when=Clamping values (price never below 0), picking the later of two dates.
devutils.sql.sheet.isDistinctFrom.title=IS DISTINCT FROM (NULL-safe compare)
devutils.sql.sheet.isDistinctFrom=Like <>, but treats NULL as a normal value: NULL IS DISTINCT FROM NULL is false, 'a' IS DISTINCT FROM NULL is true.
devutils.sql.sheet.isDistinctFrom.when=Detecting changes between old and new values, and comparing nullable columns.
devutils.sql.sheet.innerJoin.title=INNER JOIN
devutils.sql.sheet.innerJoin=Rows that have a match in both tables. JOIN alone means INNER JOIN.
devutils.sql.sheet.innerJoin.when=Related data that must exist on both sides (an order always has a customer).
devutils.sql.sheet.leftJoin.title=LEFT JOIN
devutils.sql.sheet.leftJoin=All rows from the left table; columns from the right table are NULL where there is no match.
devutils.sql.sheet.leftJoin.when=Optional relations: customers with or without orders, users with or without a profile.
devutils.sql.sheet.leftJoinFilter.title=LEFT JOIN with a filter in ON
devutils.sql.sheet.leftJoinFilter=Filters on the right table belong in ON. In WHERE (o.status = 'paid') they remove customers without paid orders and the join behaves like INNER JOIN.
devutils.sql.sheet.leftJoinFilter.when=Optional relations with a condition: "all customers, plus their paid orders if any".
devutils.sql.sheet.leftJoinNull.title=LEFT JOIN … IS NULL (rows without a match)
devutils.sql.sheet.leftJoinNull=Anti join with LEFT JOIN: keep only rows where the right side found nothing. Check a NOT NULL column of the right table, usually its id.
devutils.sql.sheet.leftJoinNull.when=Finding customers without orders or orphan rows. Same result as NOT EXISTS; use whichever reads better.
devutils.sql.sheet.rightJoin.title=RIGHT JOIN
devutils.sql.sheet.rightJoin=All rows from the right table, with NULLs where the left table has no match. Same as swapping the tables in a LEFT JOIN.
devutils.sql.sheet.rightJoin.when=Rare; most teams write LEFT JOIN for readability. Useful to find orders whose customer no longer exists when there is no foreign key.
devutils.sql.sheet.fullJoin.title=FULL OUTER JOIN
devutils.sql.sheet.fullJoin=All rows from both tables, matched where possible. MySQL has no FULL JOIN: use LEFT JOIN … UNION … RIGHT JOIN.
devutils.sql.sheet.fullJoin.when=Reconciliation: comparing two data sets to find rows missing or different on either side.
devutils.sql.sheet.crossJoin.title=CROSS JOIN
devutils.sql.sheet.crossJoin=Every combination of rows (Cartesian product).
devutils.sql.sheet.crossJoin.when=Generating combinations such as size × color or a calendar × product grid. Watch the row count: 1,000 × 1,000 = 1,000,000.
devutils.sql.sheet.selfJoin.title=Self join
devutils.sql.sheet.selfJoin=Join a table to itself with two aliases.
devutils.sql.sheet.selfJoin.when=Hierarchies in one table (employee → manager) and comparing rows of the same table.
devutils.sql.sheet.selfJoinDuplicates.title=Self join to find duplicates
devutils.sql.sheet.selfJoinDuplicates=Pair each row with later rows that have the same email. b.id > a.id lists each pair once.
devutils.sql.sheet.selfJoinDuplicates.when=Data cleanup before adding a UNIQUE constraint.
devutils.sql.sheet.multiJoin.title=Joining several tables
devutils.sql.sheet.multiJoin=Chain joins; each ON links the new table to one already joined. MySQL interval syntax: NOW() - INTERVAL 7 DAY.
devutils.sql.sheet.multiJoin.when=Reports and detail pages. Index every foreign key column used in ON.
devutils.sql.sheet.usingJoin.title=JOIN … USING
devutils.sql.sheet.usingJoin=Short form when both tables have a column with the same name; the column appears once in SELECT *.
devutils.sql.sheet.usingJoin.when=Schemas that name foreign keys the same as the referenced key (customer_id in both tables).
devutils.sql.sheet.lateral.title=LATERAL join (top-N per group)
devutils.sql.sheet.lateral=A subquery that can use columns of the row on its left. MySQL 8.0.14+ supports LATERAL; SQL Server uses CROSS APPLY / OUTER APPLY.
devutils.sql.sheet.lateral.when=Latest N orders per customer with an index on (customer_id, created_at). Use LEFT JOIN LATERAL … ON true to keep customers without orders.
devutils.sql.sheet.scalarSubquery.title=Scalar subquery
devutils.sql.sheet.scalarSubquery=A subquery that returns exactly one value, used like a constant. It fails if it returns more than one row.
devutils.sql.sheet.scalarSubquery.when=Comparing against an aggregate of the whole table (above-average price).
devutils.sql.sheet.inSubquery.title=IN (subquery)
devutils.sql.sheet.inSubquery=Keep rows whose value appears in the subquery result.
devutils.sql.sheet.inSubquery.when=Filtering by a list that comes from another table. Modern optimizers run IN and EXISTS equally fast.
devutils.sql.sheet.exists.title=EXISTS
devutils.sql.sheet.exists=True when the subquery returns at least one row. It stops at the first match, and never duplicates outer rows like a JOIN can.
devutils.sql.sheet.exists.when=Filtering by "has any related row": customers with a recent order, products with stock in any warehouse.
devutils.sql.sheet.notExists.title=NOT EXISTS
devutils.sql.sheet.notExists=True when the subquery returns no rows (anti join).
devutils.sql.sheet.notExists.when=Rows without related data: customers without orders, orphan records. Safe with NULLs, unlike NOT IN.
devutils.sql.sheet.notInNull.title=NOT IN pitfall with NULL
devutils.sql.sheet.notInNull=If the subquery returns any NULL, x NOT IN (…) is never true, so the query silently returns nothing.
devutils.sql.sheet.notInNull.when=Always prefer NOT EXISTS over NOT IN with a subquery, unless the column is NOT NULL.
devutils.sql.sheet.any.title=ANY / SOME
devutils.sql.sheet.any=Compare with each value of the subquery; true if the comparison holds for at least one. = ANY is the same as IN. SOME is a synonym.
devutils.sql.sheet.any.when=Comparisons other than equality against a set: "more expensive than at least one product in category 3".
devutils.sql.sheet.anyArray.title== ANY(array) (PostgreSQL)
devutils.sql.sheet.anyArray=Match against an array parameter. One prepared statement works for any list length.
devutils.sql.sheet.anyArray.when=Passing a list of ids from the application (JDBC: connection.createArrayOf("bigint", ids)) instead of building IN (?, ?, ?) dynamically.
devutils.sql.sheet.all.title=ALL
devutils.sql.sheet.all=True if the comparison holds for every value of the subquery. With an empty subquery ALL is true; with a NULL in it the result can be NULL.
devutils.sql.sheet.all.when=Comparisons against every value: "more expensive than every product in category 3". MAX() in a scalar subquery is often clearer.
devutils.sql.sheet.correlated.title=Correlated subquery
devutils.sql.sheet.correlated=A subquery that uses a column of the outer row, so it runs once per outer row.
devutils.sql.sheet.correlated.when=Small result sets. For large ones use a window function (AVG(price) OVER (PARTITION BY category_id)) or a join to a grouped subquery.
devutils.sql.sheet.derivedTable.title=Subquery in FROM (derived table)
devutils.sql.sheet.derivedTable=Use a query result as a table. It needs an alias.
devutils.sql.sheet.derivedTable.when=Filtering on aggregates or window results (WHERE on rn or total_spent) without HAVING.
devutils.sql.sheet.cte.title=WITH (CTE)
devutils.sql.sheet.cte=Common table expression: a named subquery that makes long queries readable, step by step.
devutils.sql.sheet.cte.when=Breaking a complex query into steps. PostgreSQL 12+ inlines CTEs; add MATERIALIZED to force computing it once. MySQL needs 8.0+.
devutils.sql.sheet.recursiveCte.title=WITH RECURSIVE (trees)
devutils.sql.sheet.recursiveCte=A CTE that references itself, repeated until no new rows are found. The depth limit stops endless loops on bad data.
devutils.sql.sheet.recursiveCte.when=Trees and graphs: category trees, org charts, bill of materials, comment threads.
devutils.sql.sheet.groupBy.title=GROUP BY with COUNT / SUM / AVG / MAX
devutils.sql.sheet.groupBy=Group rows and compute one result per group. Every selected column must be in GROUP BY or inside an aggregate.
devutils.sql.sheet.groupBy.when=Totals per customer, category, or day.
devutils.sql.sheet.having.title=HAVING (filter after grouping)
devutils.sql.sheet.having=WHERE filters rows before grouping; HAVING filters groups after aggregation. Order: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT.
devutils.sql.sheet.having.when=Conditions on aggregates: customers who spent more than 1000, products sold more than 10 times. Put row filters in WHERE, not HAVING, so fewer rows are grouped.
devutils.sql.sheet.countDistinct.title=COUNT(*) vs COUNT(column) vs COUNT(DISTINCT)
devutils.sql.sheet.countDistinct=COUNT(*) counts rows, COUNT(phone) skips NULL phones, COUNT(DISTINCT city) counts unique non-NULL cities.
devutils.sql.sheet.countDistinct.when=Choose deliberately: the three give different numbers on the same table. COUNT(DISTINCT) is expensive on big tables.
devutils.sql.sheet.filter.title=Aggregate FILTER (WHERE …)
devutils.sql.sheet.filter=Conditional aggregate in PostgreSQL and SQLite. Elsewhere use SUM(CASE WHEN … THEN 1 ELSE 0 END).
devutils.sql.sheet.filter.when=Several counts with different conditions in one pass over the table.
devutils.sql.sheet.stringAgg.title=STRING_AGG / GROUP_CONCAT
devutils.sql.sheet.stringAgg=Join the values of a group into one string. MySQL truncates GROUP_CONCAT at group_concat_max_len (1024 bytes by default).
devutils.sql.sheet.stringAgg.when=Showing lists in one cell (tags, SKUs) for reports and exports.
devutils.sql.sheet.rollup.title=GROUP BY ROLLUP (subtotals)
devutils.sql.sheet.rollup=Adds subtotal rows per region and a grand total row; subtotal rows have NULL in the rolled-up columns. MySQL: GROUP BY region, product WITH ROLLUP.
devutils.sql.sheet.rollup.when=Reports that need subtotals without a second query.
devutils.sql.sheet.rowNumber.title=ROW_NUMBER() (latest row per group)
devutils.sql.sheet.rowNumber=Number rows inside each partition, then keep rn = 1. Window results cannot be filtered in WHERE of the same query, hence the subquery.
devutils.sql.sheet.rowNumber.when=Latest or first row per group, and deduplication while keeping one row.
devutils.sql.sheet.rank.title=RANK / DENSE_RANK
devutils.sql.sheet.rank=RANK leaves gaps after ties (1, 1, 3); DENSE_RANK does not (1, 1, 2).
devutils.sql.sheet.rank.when=Leaderboards and top-N lists where ties matter.
devutils.sql.sheet.lagLead.title=LAG / LEAD
devutils.sql.sheet.lagLead=LAG reads the previous row, LEAD the next row, in the window order.
devutils.sql.sheet.lagLead.when=Day-over-day differences, growth rates, and gaps between events.
devutils.sql.sheet.runningTotal.title=Running total & moving average
devutils.sql.sheet.runningTotal=Aggregate over a window of rows without collapsing them.
devutils.sql.sheet.runningTotal.when=Cumulative metrics and smoothing time series while keeping every row.
devutils.sql.sheet.percentOfTotal.title=Percent of total (OVER ())
devutils.sql.sheet.percentOfTotal=An empty OVER () is the whole result, so each row can be divided by the grand total. 100.0 forces decimal division.
devutils.sql.sheet.percentOfTotal.when=Share of revenue per product, region, or channel.
devutils.sql.sheet.union.title=UNION
devutils.sql.sheet.union=Combine the results of two queries and remove duplicates. Columns are matched by position; count and types must match.
devutils.sql.sheet.union.when=Merging similar data from different tables when duplicates must go.
devutils.sql.sheet.unionAll.title=UNION ALL
devutils.sql.sheet.unionAll=Combine results and keep duplicates. Faster than UNION because it skips the deduplication step.
devutils.sql.sheet.unionAll.when=The default choice when parts cannot overlap or duplicates are fine.
devutils.sql.sheet.unionOrder.title=UNION with ORDER BY / LIMIT
devutils.sql.sheet.unionOrder=ORDER BY and LIMIT at the end apply to the combined result. Column names come from the first query; a constant column marks where each row came from.
devutils.sql.sheet.unionOrder.when=Activity feeds and search results built from several tables.
devutils.sql.sheet.intersect.title=INTERSECT
devutils.sql.sheet.intersect=Rows present in both results.
devutils.sql.sheet.intersect.when=Overlap between two lists (customers who are also leads). MySQL needs 8.0.31+.
devutils.sql.sheet.except.title=EXCEPT / MINUS
devutils.sql.sheet.except=Rows in the first result but not in the second (Oracle: MINUS). MySQL needs 8.0.31+.
devutils.sql.sheet.except.when=Differences between two lists (subscribers minus unsubscribed).
devutils.sql.sheet.insert.title=INSERT … VALUES (multi-row)
devutils.sql.sheet.insert=Insert one or more rows. One multi-row INSERT is much faster than many single inserts.
devutils.sql.sheet.insert.when=Creating data. Always list the columns so later schema changes do not break it. Batch around 500–1000 rows per statement.
devutils.sql.sheet.insertSelect.title=INSERT … SELECT
devutils.sql.sheet.insertSelect=Insert the result of a query, without sending data through the application.
devutils.sql.sheet.insertSelect.when=Copying, archiving, and filling summary tables inside the database.
devutils.sql.sheet.returning.title=INSERT … RETURNING
devutils.sql.sheet.returning=Return values of the new rows (PostgreSQL, SQLite, MariaDB; SQL Server: OUTPUT inserted.id). MySQL: LAST_INSERT_ID().
devutils.sql.sheet.returning.when=Getting generated ids and defaults without a second query.
devutils.sql.sheet.upsertPg.title=UPSERT: ON CONFLICT DO UPDATE (PostgreSQL)
devutils.sql.sheet.upsertPg=Insert, or update the existing row when the unique key already exists. EXCLUDED is the row that was proposed. Also works in SQLite.
devutils.sql.sheet.upsertPg.when=Idempotent writes: syncs, counters, imports that may run twice. Needs a unique index on the conflict column.
devutils.sql.sheet.upsertMysql.title=UPSERT: ON DUPLICATE KEY UPDATE (MySQL)
devutils.sql.sheet.upsertMysql=MySQL / MariaDB upsert. The row alias (AS new) needs MySQL 8.0.19+; older versions use VALUES(qty).
devutils.sql.sheet.upsertMysql.when=Same as ON CONFLICT, on MySQL. It fires on any unique key, not only the one you expect.
devutils.sql.sheet.insertIgnore.title=Insert if not exists (DO NOTHING / INSERT IGNORE)
devutils.sql.sheet.insertIgnore=Skip the row when it would violate a unique key. MySQL INSERT IGNORE also hides other errors (bad data becomes warnings).
devutils.sql.sheet.insertIgnore.when=Tags, lookups, and idempotent event processing. Prefer ON DUPLICATE KEY UPDATE id = id on MySQL to avoid hiding errors.
devutils.sql.sheet.merge.title=MERGE
devutils.sql.sheet.merge=Standard SQL: update matching rows and insert missing ones in one statement (PostgreSQL 15+, Oracle, SQL Server).
devutils.sql.sheet.merge.when=Synchronizing a target table from a staging table. On SQL Server add HOLDLOCK or use explicit locking to avoid race conditions.
devutils.sql.sheet.bulkLoad.title=Bulk load CSV (COPY / LOAD DATA)
devutils.sql.sheet.bulkLoad=Load a file in one command, far faster than INSERTs. COPY reads a file on the database server; psql \\copy and LOAD DATA LOCAL read a file on your machine.
devutils.sql.sheet.bulkLoad.when=Imports and migrations of thousands to millions of rows. Load into a staging table first, validate, then INSERT … SELECT.
devutils.sql.sheet.update.title=UPDATE … SET … WHERE
devutils.sql.sheet.update=Change existing rows. Without WHERE every row in the table is updated.
devutils.sql.sheet.update.when=Changing data. Run the same WHERE as a SELECT first, and do it inside a transaction.
devutils.sql.sheet.updateFromSelect.title=UPDATE from a SELECT (PostgreSQL)
devutils.sql.sheet.updateFromSelect=Update rows with values calculated by a subquery joined in FROM. SQL Server uses the same idea: UPDATE c SET … FROM customers c JOIN (…) s ON ….
devutils.sql.sheet.updateFromSelect.when=Recalculating stored totals, syncing values from aggregates or staging tables.
devutils.sql.sheet.updateJoin.title=UPDATE … FROM another table (PostgreSQL)
devutils.sql.sheet.updateJoin=Update using conditions or values from a joined table. Do not list the target table again in FROM, or every row is joined to every row.
devutils.sql.sheet.updateJoin.when=Bulk updates based on related data.
devutils.sql.sheet.updateJoinMysql.title=UPDATE … JOIN (MySQL)
devutils.sql.sheet.updateJoinMysql=The MySQL / MariaDB form of an update with a join.
devutils.sql.sheet.updateJoinMysql.when=Same as UPDATE … FROM, on MySQL.
devutils.sql.sheet.updateSubquery.title=UPDATE … SET col = (SELECT …)
devutils.sql.sheet.updateSubquery=Set a column from a correlated subquery. Works on every database. Rows without a match get NULL; add WHERE EXISTS (…) to leave them unchanged.
devutils.sql.sheet.updateSubquery.when=Denormalized fields such as last_sold_at, when portability matters.
devutils.sql.sheet.updateWhereIn.title=UPDATE … WHERE id IN (SELECT …)
devutils.sql.sheet.updateWhereIn=Choose the rows to update with a subquery. MySQL cannot select from the same table it updates (error 1093); wrap the subquery in another SELECT or use UPDATE … JOIN.
devutils.sql.sheet.updateWhereIn.when=Status changes based on activity in another table.
devutils.sql.sheet.updateCase.title=Bulk UPDATE with CASE
devutils.sql.sheet.updateCase=Different values for different rows in one statement. Keep the WHERE, or rows not listed are rewritten with their own value.
devutils.sql.sheet.updateCase.when=Updating a small batch of rows with different values, on every database.
devutils.sql.sheet.updateValues.title=Bulk UPDATE from VALUES (PostgreSQL)
devutils.sql.sheet.updateValues=Join a literal list of (id, value) pairs. MySQL 8.0.19+ can do the same with UPDATE … JOIN (VALUES ROW(1, 9.99), ROW(2, 19.99)).
devutils.sql.sheet.updateValues.when=Applying many per-row changes from the application in one round trip.
devutils.sql.sheet.updateReturning.title=UPDATE … RETURNING
devutils.sql.sheet.updateReturning=Change rows and get them back in one step. The extra status check makes the claim safe: a second worker updates 0 rows.
devutils.sql.sheet.updateReturning.when=Claiming jobs, state transitions, and audit logs. SQL Server: OUTPUT inserted.*.
devutils.sql.sheet.selectForUpdate.title=SELECT … FOR UPDATE, then UPDATE
devutils.sql.sheet.selectForUpdate=Lock the row while reading, so nobody changes it before your UPDATE. Other writers wait until COMMIT.
devutils.sql.sheet.selectForUpdate.when=Read-check-write logic that cannot be one UPDATE (checking stock, balance, or rules in code). See Concepts → Locking.
devutils.sql.sheet.updateBatch.title=UPDATE in batches
devutils.sql.sheet.updateBatch=Update a limited number of rows per statement and repeat until nothing changes.
devutils.sql.sheet.updateBatch.when=Millions of rows on a live database: short locks, less replication lag, and smaller undo/WAL per transaction.
devutils.sql.sheet.delete.title=DELETE … WHERE
devutils.sql.sheet.delete=Remove rows that match WHERE. Without WHERE every row is deleted.
devutils.sql.sheet.delete.when=Removing data. Run the WHERE as a SELECT first, inside a transaction.
devutils.sql.sheet.deleteSubquery.title=DELETE … WHERE IN (SELECT …)
devutils.sql.sheet.deleteSubquery=Choose the rows to delete with a subquery. Works on every database (MySQL: not from the same table, see error 1093).
devutils.sql.sheet.deleteSubquery.when=Deleting children of rows that match a condition.
devutils.sql.sheet.deleteExists.title=DELETE orphans with NOT EXISTS
devutils.sql.sheet.deleteExists=Delete rows whose parent no longer exists. MySQL before 8.0.16 does not allow an alias here: use DELETE s FROM sessions s WHERE ….
devutils.sql.sheet.deleteExists.when=Cleanup when there is no foreign key, before adding one.
devutils.sql.sheet.deleteUsing.title=DELETE … USING (PostgreSQL)
devutils.sql.sheet.deleteUsing=Delete with a join in PostgreSQL. USING lists the extra tables; the join condition goes in WHERE.
devutils.sql.sheet.deleteUsing.when=Deleting based on related tables.
devutils.sql.sheet.deleteJoinMysql.title=DELETE … JOIN (MySQL)
devutils.sql.sheet.deleteJoinMysql=MySQL form: name the table(s) to delete from between DELETE and FROM. Listing both aliases deletes from both tables.
devutils.sql.sheet.deleteJoinMysql.when=Same as DELETE … USING, on MySQL.
devutils.sql.sheet.deleteDuplicates.title=Delete duplicates, keep one
devutils.sql.sheet.deleteDuplicates=Number the rows per email and delete every row after the first (lowest id). The extra subquery level also makes it work on MySQL.
devutils.sql.sheet.deleteDuplicates.when=Cleanup before adding a UNIQUE constraint. Check the SELECT first and back up the table.
devutils.sql.sheet.deleteBatch.title=DELETE in batches
devutils.sql.sheet.deleteBatch=Delete a limited number of rows per statement and repeat until 0 rows are deleted.
devutils.sql.sheet.deleteBatch.when=Purging millions of rows on a live system. For time-based retention, dropping partitions is even cheaper.
devutils.sql.sheet.archiveMove.title=Move rows to an archive (PostgreSQL)
devutils.sql.sheet.archiveMove=A data-modifying CTE deletes and inserts in one atomic statement: no row is lost or copied twice.
devutils.sql.sheet.archiveMove.when=Archiving old data. On MySQL use INSERT … SELECT then DELETE with the same WHERE, in one transaction.
devutils.sql.sheet.softDelete.title=Soft delete (deleted_at)
devutils.sql.sheet.softDelete=Mark rows as deleted instead of removing them. Every query must then filter deleted_at IS NULL (a view or partial index helps).
devutils.sql.sheet.softDelete.when=Data that users may restore or that audits need. Not a replacement for real deletion when privacy rules require it.
devutils.sql.sheet.truncate.title=TRUNCATE
devutils.sql.sheet.truncate=Remove all rows at once without scanning them. RESTART IDENTITY resets the id sequence (MySQL always resets AUTO_INCREMENT). Takes an exclusive lock; in MySQL it also commits implicitly.
devutils.sql.sheet.truncate.when=Emptying staging or test tables. It cannot be filtered and fires no DELETE triggers.
devutils.sql.sheet.currentDateTime.title=Current date and time
devutils.sql.sheet.currentDateTime=now() and CURRENT_TIMESTAMP return the transaction start time, the same for every row; clock_timestamp() is the real current time (PostgreSQL).
devutils.sql.sheet.currentDateTime.when=Defaults for created_at, "today" filters, and expiry checks.
devutils.sql.sheet.dateTypes.title=DATE vs TIMESTAMP vs TIMESTAMPTZ
devutils.sql.sheet.dateTypes=TIMESTAMPTZ stores an exact moment (shown in the session time zone); TIMESTAMP stores wall-clock time without a zone. MySQL: TIMESTAMP is UTC-converted (until 2038), DATETIME is not.
devutils.sql.sheet.dateTypes.when=Use TIMESTAMPTZ (PostgreSQL) or DATETIME in UTC (MySQL) for events; DATE for birthdays and due dates.
devutils.sql.sheet.dateRange.title=Filter a date range (half-open)
devutils.sql.sheet.dateRange=Use >= start AND < next start. It includes the whole last day and uses the index on created_at.
devutils.sql.sheet.dateRange.when=Every date filter. Avoid DATE(created_at) = '2026-11-05' or EXTRACT in WHERE: functions on the column disable the index.
devutils.sql.sheet.lastNDays.title=Last N days / today
devutils.sql.sheet.lastNDays=Compare with now() minus an interval, or with CURRENT_DATE for "since midnight".
devutils.sql.sheet.lastNDays.when=Dashboards, recent activity, and cleanup jobs.
devutils.sql.sheet.dateArithmetic.title=Add / subtract intervals
devutils.sql.sheet.dateArithmetic=Add or subtract time with INTERVAL. DATE + integer adds days (PostgreSQL). Adding 1 month to 31 Jan gives 28/29 Feb.
devutils.sql.sheet.dateArithmetic.when=Expiry dates, renewals, reminders, and SLA deadlines.
devutils.sql.sheet.dateTrunc.title=Group by day / week / month (date_trunc)
devutils.sql.sheet.dateTrunc=Round a timestamp down to the start of the day, week (Monday), month, or year.
devutils.sql.sheet.dateTrunc.when=Time-series reports. Truncate in the user's time zone: date_trunc('day', created_at AT TIME ZONE 'Asia/Jakarta').
devutils.sql.sheet.extract.title=EXTRACT (year, month, weekday)
devutils.sql.sheet.extract=Get one part of a date or timestamp as a number.
devutils.sql.sheet.extract.when=Reports by weekday or hour, and seasonal analysis. Do not use it to filter ranges; it prevents index use.
devutils.sql.sheet.dateDiff.title=Difference between dates
devutils.sql.sheet.dateDiff=timestamp - timestamp gives an interval; EXTRACT(EPOCH …) turns it into seconds; date - date gives whole days.
devutils.sql.sheet.dateDiff.when=Durations, SLA times, and overdue days.
devutils.sql.sheet.age.title=Age in years
devutils.sql.sheet.age=age() returns years, months, and days between two dates; EXTRACT(YEAR …) keeps the full years.
devutils.sql.sheet.age.when=Customer age, membership length, and contract duration.
devutils.sql.sheet.formatDate.title=Format a date as text
devutils.sql.sheet.formatDate=Turn a date into a string with a pattern. Pattern letters differ per database.
devutils.sql.sheet.formatDate.when=Exports and reports. In applications, return real dates and format them in the UI instead.
devutils.sql.sheet.parseDate.title=Parse text into a date
devutils.sql.sheet.parseDate=Read a date from a string with a known pattern.
devutils.sql.sheet.parseDate.when=Imports with local date formats such as DD/MM/YYYY. ISO 8601 (2026-11-05) casts directly without a pattern.
devutils.sql.sheet.timeZone.title=Time zones (AT TIME ZONE)
devutils.sql.sheet.timeZone=Convert a TIMESTAMPTZ to local wall-clock time. Use region names like Asia/Jakarta, not fixed offsets, so daylight saving is handled. MySQL needs the time zone tables loaded.
devutils.sql.sheet.timeZone.when=Showing or grouping times in the user's zone. Store in UTC, convert at the edges.
devutils.sql.sheet.monthBounds.title=First and last day of the month
devutils.sql.sheet.monthBounds=date_trunc gives the first day; adding 1 month minus 1 day gives the last.
devutils.sql.sheet.monthBounds.when=Monthly billing and reports. For filters prefer >= first day AND < first day of next month.
devutils.sql.sheet.generateSeries.title=Fill missing days (generate_series)
devutils.sql.sheet.generateSeries=Generate every day and LEFT JOIN the data, so days without orders show 0 instead of disappearing. MySQL 8: build the days with WITH RECURSIVE.
devutils.sql.sheet.generateSeries.when=Charts and reports that need a continuous time axis.
devutils.sql.sheet.epoch.title=Unix timestamp conversion
devutils.sql.sheet.epoch=Convert between timestamps and seconds since 1970-01-01 UTC.
devutils.sql.sheet.epoch.when=Integrations, JWT exp claims, and logs that use epoch seconds (divide by 1000 for milliseconds).
devutils.sql.sheet.overlap.title=Overlapping time ranges
devutils.sql.sheet.overlap=Two ranges overlap when each starts before the other ends. This catches every case: inside, around, and partly overlapping.
devutils.sql.sheet.overlap.when=Double-booking checks. PostgreSQL can enforce it with an EXCLUDE constraint on tstzrange (btree_gist extension).
devutils.sql.sheet.concat.title=Concatenate (|| / CONCAT / CONCAT_WS)
devutils.sql.sheet.concat=|| returns NULL when any part is NULL; CONCAT_WS skips NULLs and adds the separator. In MySQL || means OR unless PIPES_AS_CONCAT is set: use CONCAT.
devutils.sql.sheet.concat.when=Full names, addresses, and display labels.
devutils.sql.sheet.caseTrim.title=LOWER / UPPER / TRIM / LENGTH
devutils.sql.sheet.caseTrim=Change case, remove surrounding spaces, and count characters. In MySQL LENGTH counts bytes; CHAR_LENGTH counts characters.
devutils.sql.sheet.caseTrim.when=Normalizing input (emails, codes) and validating lengths.
devutils.sql.sheet.substring.title=LEFT / RIGHT / SUBSTRING / POSITION
devutils.sql.sheet.substring=Take part of a string. Positions start at 1, not 0.
devutils.sql.sheet.substring.when=Parsing codes, prefixes, and fixed-format identifiers.
devutils.sql.sheet.replaceSplit.title=REPLACE / SPLIT_PART
devutils.sql.sheet.replaceSplit=Replace every occurrence of a text, and take the n-th part of a split string.
devutils.sql.sheet.replaceSplit.when=Cleaning phone numbers, extracting email domains, simple parsing.
devutils.sql.sheet.regex.title=Regular expressions
devutils.sql.sheet.regex=~ matches a regex, ~* is case-insensitive (PostgreSQL); regexp_replace with 'g' replaces all matches.
devutils.sql.sheet.regex.when=Validation and cleanup that LIKE cannot express. Regex filters cannot use normal indexes.
devutils.sql.sheet.pad.title=LPAD / RPAD
devutils.sql.sheet.pad=Pad a string to a fixed length.
devutils.sql.sheet.pad.when=Invoice numbers, codes, and fixed-width exports.
devutils.sql.sheet.fullText.title=Full-text search
devutils.sql.sheet.fullText=Search words (with stemming) instead of raw substrings. Add a GIN index on the same to_tsvector expression to make it fast.
devutils.sql.sheet.fullText.when=Search boxes over articles, products, and tickets, before reaching for Elasticsearch.
devutils.sql.sheet.jsonType.title=JSONB column and insert
devutils.sql.sheet.jsonType=Use JSONB: it is stored parsed, supports indexes and operators, and drops whitespace and duplicate keys. JSON keeps the exact input text (key order, duplicates) and is parsed again on every read. A string parameter arrives as text, so cast it to jsonb.
devutils.sql.sheet.jsonType.when=Optional attributes, external payloads (webhooks, API responses), and per-user settings. Fields you filter, join, or put constraints on belong in real columns.
devutils.sql.sheet.jsonRead.title=Read JSON fields (-> / ->>)
devutils.sql.sheet.jsonRead=-> returns jsonb and ->> returns text; an integer picks an array element (0-based). A missing key gives NULL, not an error. Cast the text before comparing numbers or dates.
devutils.sql.sheet.jsonRead.when=Selecting values from payloads, settings, and flexible attributes.
devutils.sql.sheet.jsonPath.title=Read by path (#>, #>>, subscript)
devutils.sql.sheet.jsonPath=The #> (jsonb) and #>> (text) operators take the whole path as a text array, handy when the path is built in code. Subscripts (PostgreSQL 14+) read like array access and return jsonb.
devutils.sql.sheet.jsonPath.when=Deeply nested documents, or a path that comes from configuration.
devutils.sql.sheet.jsonFilterValue.title=Filter and sort by a JSON value
devutils.sql.sheet.jsonFilterValue=->> always returns text, so cast it for numeric and date comparisons: as text '9' > '100'. One row with a bad value (e.g. "amount": "n/a") makes the cast, and the whole query, fail.
devutils.sql.sheet.jsonFilterValue.when=Reports and admin queries on payload fields. For filters that run all the time, add an expression index or a generated column (see below).
devutils.sql.sheet.jsonFilter.title=Filter JSONB by containment (@>)
devutils.sql.sheet.jsonFilter=True when the document contains the given keys and values at that position; for arrays, when the array contains the listed elements. A GIN index serves @>, while payload->>'type' = 'signup' needs an expression index on exactly that expression.
devutils.sql.sheet.jsonFilter.when=Finding events or documents by type, tag, or nested attribute.
devutils.sql.sheet.jsonKeyExists.title=Key exists (?, ?|, ?&)
devutils.sql.sheet.jsonKeyExists=Checks whether a top-level key is present, even when its value is JSON null. The default GIN index (jsonb_ops) serves these operators. In JDBC, ? is a bind parameter, so escape it as ?? or use @? with a JSON path.
devutils.sql.sheet.jsonKeyExists.when=Optional fields and flags: rows that have a coupon, or rows missing a required key (NOT (payload ? 'email')).
devutils.sql.sheet.jsonPathQuery.title=JSON path queries (@?, @@, jsonb_path_*)
devutils.sql.sheet.jsonPathQuery=SQL/JSON path (PostgreSQL 12+) tests and extracts values inside arrays without unnesting them. @? and @@ can use a GIN index. Pass values through the vars argument instead of concatenating them into the path string.
devutils.sql.sheet.jsonPathQuery.when=Conditions on array elements (any line item with qty > 10) and pulling a list of values out of each document.
devutils.sql.sheet.jsonSqlStandard.title=Standard SQL/JSON functions (JSON_VALUE, JSON_QUERY, JSON_EXISTS)
devutils.sql.sheet.jsonSqlStandard=SQL-standard syntax available from PostgreSQL 17. RETURNING converts the type, and ON EMPTY / ON ERROR choose what to return when the path is missing or the value has the wrong type.
devutils.sql.sheet.jsonSqlStandard.when=Queries that should look the same on several databases, or a typed result without a manual cast.
devutils.sql.sheet.jsonArray.title=Expand a JSON array into rows
devutils.sql.sheet.jsonArray=jsonb_array_elements_text returns one row per element; a NULL array gives no rows, but a value that is not an array raises an error. jsonb_array_length counts the elements.
devutils.sql.sheet.jsonArray.when=Counting, filtering, or joining on tags and lists stored in JSON.
devutils.sql.sheet.jsonToRecordset.title=Array of objects to typed rows (jsonb_to_recordset, JSON_TABLE)
devutils.sql.sheet.jsonToRecordset=Turns each object in the array into a row with typed columns from the AS list. Keys not in the list are ignored and missing keys become NULL. LATERAL lets the function read each order's own payload.
devutils.sql.sheet.jsonToRecordset.when=Reporting on line items, addresses, or other objects embedded in a document, and joining them with normal tables.
devutils.sql.sheet.jsonEach.title=List keys and values (jsonb_each, jsonb_object_keys)
devutils.sql.sheet.jsonEach=Turns each top-level key into a row. Counting keys across all rows shows which fields actually appear in the data.
devutils.sql.sheet.jsonEach.when=Exploring an unknown payload, finding misspelled keys, and planning to move a field into a real column.
devutils.sql.sheet.jsonGroupBy.title=Report on JSON fields (GROUP BY)
devutils.sql.sheet.jsonGroupBy=Group and aggregate extracted values like normal columns. Cast before sum or avg; rows where the key is missing give NULL, which sum and avg skip.
devutils.sql.sheet.jsonGroupBy.when=Dashboards over event, log, and webhook tables. For frequent reports a generated column or a summary table is cheaper.
devutils.sql.sheet.jsonBuild.title=Build nested JSON (jsonb_agg, jsonb_build_object)
devutils.sql.sheet.jsonBuild=Return nested JSON straight from the database: one row per customer with an array of orders. With LEFT JOIN, FILTER drops the empty row of customers without orders and COALESCE returns [] instead of NULL.
devutils.sql.sheet.jsonBuild.when=API endpoints that need nested data in one query instead of N+1 queries.
devutils.sql.sheet.jsonObjectAgg.title=Rows to one JSON object (jsonb_object_agg)
devutils.sql.sheet.jsonObjectAgg=Builds a key/value map from rows. With duplicate keys the last one wins; a NULL key raises an error.
devutils.sql.sheet.jsonObjectAgg.when=Returning a key/value settings table as one object, or a lookup map for the frontend.
devutils.sql.sheet.jsonRowToJson.title=Row to JSON (to_jsonb, jsonb_strip_nulls, jsonb_pretty)
devutils.sql.sheet.jsonRowToJson=to_jsonb turns a whole row into an object keyed by column name; remove sensitive columns with -. jsonb_strip_nulls drops null fields and jsonb_pretty indents the output for reading.
devutils.sql.sheet.jsonRowToJson.when=Audit and history tables (store the old row as JSON), quick exports, and debugging.
devutils.sql.sheet.jsonUpdate.title=Update one JSON field (jsonb_set, subscript)
devutils.sql.sheet.jsonUpdate=The path is a text array and the new value must be jsonb: '"dark"' is a JSON string, to_jsonb() converts SQL values. jsonb_set does not create missing parents ({notify,email} needs notify to exist); subscript assignment (14+) does. Doing it in SQL is atomic, while read-modify-write in the application loses concurrent changes.
devutils.sql.sheet.jsonUpdate.when=Settings, preferences, and status flags stored as JSON.
devutils.sql.sheet.jsonMerge.title=Merge keys (||)
devutils.sql.sheet.jsonMerge=Adds or overwrites top-level keys from the right side. The merge is shallow: a nested object on the right replaces the whole nested object. COALESCE avoids a NULL result when the column is NULL.
devutils.sql.sheet.jsonMerge.when=PATCH endpoints and saving several settings at once.
devutils.sql.sheet.jsonRemove.title=Remove keys or array elements (-, #-)
devutils.sql.sheet.jsonRemove=The - operator removes a top-level key, several keys (text[]), or matching string elements from an array; #- removes a nested path. Removing something that is not there changes nothing. Keep the WHERE on the last statement: rows without tags would get NULL, and jsonb_set would wipe the payload.
devutils.sql.sheet.jsonRemove.when=Dropping obsolete settings, untagging, and stripping sensitive fields (password, token) before storing or returning JSON.
devutils.sql.sheet.jsonArrayAppend.title=Append to a JSON array
devutils.sql.sheet.jsonArrayAppend=|| between two arrays concatenates them. COALESCE handles a missing array, and the extra WHERE keeps values unique. jsonb_insert adds an element before the given index.
devutils.sql.sheet.jsonArrayAppend.when=Tags, short history lists, and other small lists in a document. Lists that grow without limit belong in a child table.
devutils.sql.sheet.jsonArrayItemUpdate.title=Update one object inside a JSON array
devutils.sql.sheet.jsonArrayItemUpdate=There is no update-by-match for arrays: unnest the array, change the matching element, and aggregate it back. WITH ORDINALITY + ORDER BY keeps the original order, and COALESCE stops an empty array from turning the payload into NULL.
devutils.sql.sheet.jsonArrayItemUpdate.when=Changing a line item, address, or step embedded in a document. If this is frequent, the array should be a child table.
devutils.sql.sheet.jsonNullTrap.title=NULL trap in jsonb_set (jsonb_set_lax)
devutils.sql.sheet.jsonNullTrap=jsonb_set and to_jsonb return NULL for a NULL input, so binding a null parameter silently sets the whole column to NULL. jsonb_set_lax (PostgreSQL 13+) stores JSON null by default, or removes the key with 'delete_key'. A NOT NULL constraint on the column turns the silent wipe into an error.
devutils.sql.sheet.jsonNullTrap.when=Every UPDATE that writes an application value into JSON.
devutils.sql.sheet.jsonImport.title=Bulk insert / upsert from a JSON array
devutils.sql.sheet.jsonImport=Send one JSON array parameter instead of thousands of INSERTs or a huge VALUES list; column types come from the AS list. Remove duplicate keys first (e.g. DISTINCT ON (sku)), or ON CONFLICT DO UPDATE fails with "cannot affect row a second time".
devutils.sql.sheet.jsonImport.when=Imports from an API or a file, and batch upserts from the application in one round trip.
devutils.sql.sheet.jsonValidate.title=Validate JSON shape (CHECK, IS JSON)
devutils.sql.sheet.jsonValidate=JSONB only guarantees valid JSON, not the structure your code expects. A CHECK that evaluates to NULL passes, so test required keys with IS NOT NULL. IS JSON (PostgreSQL 16+) checks text before casting it.
devutils.sql.sheet.jsonValidate.when=Payloads the code depends on (type, version). On a large table add the constraint NOT VALID, then VALIDATE CONSTRAINT.
devutils.sql.sheet.jsonIndex.title=Index JSONB (GIN, expression index)
devutils.sql.sheet.jsonIndex=jsonb_path_ops is smaller and faster but only serves @>, @?, and @@; the default jsonb_ops also serves ?, ?|, and ?&. A B-tree on one expression serves =, ranges, and ORDER BY, but only when the query uses exactly the same expression.
devutils.sql.sheet.jsonIndex.when=Any JSON filter on a large table. Confirm with EXPLAIN that the index is used.
devutils.sql.sheet.jsonGenerated.title=Promote a JSON field to a column (generated column)
devutils.sql.sheet.jsonGenerated=A STORED generated column is computed on every write and can be indexed and used like a normal column. Write STORED explicitly (PostgreSQL 18 defaults to VIRTUAL). Adding it rewrites the table, so plan it for a quiet window on big tables.
devutils.sql.sheet.jsonGenerated.when=A JSON field that is filtered, joined, or sorted on constantly, while writers keep sending the whole JSON.
devutils.sql.sheet.createTable.title=CREATE TABLE
devutils.sql.sheet.createTable=Table with an identity primary key, foreign key, CHECK constraint, and defaults. MySQL: BIGINT AUTO_INCREMENT, DECIMAL, DATETIME.
devutils.sql.sheet.createTable.when=New tables. Put rules in constraints so bad data is rejected by the database, not only by code.
devutils.sql.sheet.createTableAs.title=Backup copy of a table (CREATE TABLE AS)
devutils.sql.sheet.createTableAs=Copy data into a new table. Indexes, constraints, and defaults are not copied.
devutils.sql.sheet.createTableAs.when=Quick safety copy before a risky manual UPDATE or DELETE. Not a real backup: use pg_dump / mysqldump for that.
devutils.sql.sheet.addColumn.title=ALTER TABLE … ADD COLUMN
devutils.sql.sheet.addColumn=Add a column. A nullable column, or one with a constant default, is instant in PostgreSQL 11+ and MySQL 8.0 (ALGORITHM=INSTANT).
devutils.sql.sheet.addColumn.when=Schema migrations.
devutils.sql.sheet.addColumnNotNull.title=Add a NOT NULL column safely
devutils.sql.sheet.addColumnNotNull=Add nullable, backfill in batches, then set the default and NOT NULL. SET NOT NULL scans the table; on very large PostgreSQL tables add a CHECK (status IS NOT NULL) NOT VALID constraint and VALIDATE it first.
devutils.sql.sheet.addColumnNotNull.when=Required columns on big, busy tables, where one long ALTER would block traffic.
devutils.sql.sheet.dropColumn.title=ALTER TABLE … DROP COLUMN
devutils.sql.sheet.dropColumn=Remove a column and its data. Indexes and constraints on it are dropped too.
devutils.sql.sheet.dropColumn.when=After the deployed code no longer reads or writes the column (two-step deploy).
devutils.sql.sheet.rename.title=RENAME COLUMN / RENAME TABLE
devutils.sql.sheet.rename=Rename without copying data. MySQL 8.0+ supports RENAME COLUMN; older versions use CHANGE old new <full type>.
devutils.sql.sheet.rename.when=Rare in production: running code still uses the old name. Prefer add new → copy → switch code → drop old.
devutils.sql.sheet.alterType.title=Change column type (ALTER COLUMN TYPE / MODIFY)
devutils.sql.sheet.alterType=Change the type; USING says how to convert existing values. MySQL MODIFY needs the full column definition, or NOT NULL and defaults are lost.
devutils.sql.sheet.alterType.when=Widening numbers or text. Most type changes rewrite the whole table under an exclusive lock: plan a maintenance window for big tables.
devutils.sql.sheet.alterDefault.title=SET / DROP DEFAULT, DROP NOT NULL
devutils.sql.sheet.alterDefault=Change a default or make a column optional. Instant: only metadata changes.
devutils.sql.sheet.alterDefault.when=Evolving rules without touching existing rows.
devutils.sql.sheet.addForeignKey.title=Add a foreign key (without a long lock)
devutils.sql.sheet.addForeignKey=NOT VALID adds the constraint for new rows instantly; VALIDATE checks old rows without blocking writes (PostgreSQL). Also index customer_id: the database does not do it for you (MySQL does).
devutils.sql.sheet.addForeignKey.when=Adding relations to large existing tables. ON DELETE RESTRICT is the safe default; CASCADE only for true child rows.
devutils.sql.sheet.addConstraint.title=ADD CONSTRAINT CHECK / UNIQUE
devutils.sql.sheet.addConstraint=Business rules enforced by the database. Adding UNIQUE fails if duplicates already exist.
devutils.sql.sheet.addConstraint.when=Rules that must never break. Name constraints so error messages and migrations are clear. On big PostgreSQL tables, build a unique index CONCURRENTLY first, then ADD CONSTRAINT … UNIQUE USING INDEX.
devutils.sql.sheet.dropConstraint.title=DROP CONSTRAINT
devutils.sql.sheet.dropConstraint=Remove a constraint by name. MySQL uses DROP FOREIGN KEY / DROP CHECK / DROP INDEX.
devutils.sql.sheet.dropConstraint.when=Changing a rule; often dropped and re-added in the same migration.
devutils.sql.sheet.view.title=CREATE OR REPLACE VIEW
devutils.sql.sheet.view=A saved query used like a table. It stores no data.
devutils.sql.sheet.view.when=Reusing joins and filters, and exposing only some columns to other teams or users.
devutils.sql.sheet.comment.title=COMMENT ON (document columns)
devutils.sql.sheet.comment=Store documentation in the schema; tools like DBeaver and psql \\d+ show it.
devutils.sql.sheet.comment.when=Units, currencies, and meanings that are not obvious from the column name.
devutils.sql.sheet.resetSequence.title=Fix the id sequence after an import
devutils.sql.sheet.resetSequence=Move the sequence past the highest id. Inserting explicit ids does not advance it, so the next INSERT fails with a duplicate key.
devutils.sql.sheet.resetSequence.when=After restoring data, importing rows with ids, or copying tables between databases.
devutils.sql.sheet.drop.title=DROP TABLE
devutils.sql.sheet.drop=Delete the table and its data permanently.
devutils.sql.sheet.drop.when=Removing temporary or obsolete tables. Check nothing uses it and that a backup exists.
devutils.sql.sheet.index.title=CREATE INDEX (composite)
devutils.sql.sheet.index=B-tree index on several columns. Column order matters: it helps filters on customer_id, or customer_id + created_at, but not created_at alone.
devutils.sql.sheet.index.when=Columns in WHERE, JOIN, and ORDER BY of frequent queries. Put equality columns first, range columns last. Each index slows writes a little.
devutils.sql.sheet.indexConcurrently.title=CREATE INDEX CONCURRENTLY
devutils.sql.sheet.indexConcurrently=Build an index without blocking writes (PostgreSQL). It cannot run inside a transaction; if it fails it leaves an INVALID index to drop. MySQL InnoDB builds indexes online by default.
devutils.sql.sheet.indexConcurrently.when=Every index on a live production table.
devutils.sql.sheet.uniqueIndex.title=UNIQUE index (with condition)
devutils.sql.sheet.uniqueIndex=Enforce uniqueness, here only among rows that are not soft-deleted.
devutils.sql.sheet.uniqueIndex.when=Business keys (email, SKU). Uniqueness checked only in code breaks under concurrent requests.
devutils.sql.sheet.partialIndex.title=Partial index
devutils.sql.sheet.partialIndex=Index only the rows that match a condition (PostgreSQL, SQLite).
devutils.sql.sheet.partialIndex.when=Queries that always target the same small subset (unpaid orders, active users). Smaller and faster than a full index.
devutils.sql.sheet.expressionIndex.title=Expression index
devutils.sql.sheet.expressionIndex=Index the result of an expression. The query must use exactly the same expression. MySQL 8.0.13+: CREATE INDEX … ((lower(email))).
devutils.sql.sheet.expressionIndex.when=Case-insensitive lookups and filters on computed values.
devutils.sql.sheet.coveringIndex.title=Covering index (INCLUDE)
devutils.sql.sheet.coveringIndex=Store extra columns in the index so the query is answered from the index alone (index-only scan). PostgreSQL 11+, SQL Server.
devutils.sql.sheet.coveringIndex.when=Very hot queries that read a few columns. In MySQL add the columns to the index key instead.
devutils.sql.sheet.ginIndex.title=GIN index (JSONB, arrays, full text)
devutils.sql.sheet.ginIndex=Index type for values that contain many items: JSONB keys, array elements, text search tokens.
devutils.sql.sheet.ginIndex.when=Speeding up @>, ?, and @@ operators. Slower to update than B-tree.
devutils.sql.sheet.listDropIndex.title=List and drop indexes
devutils.sql.sheet.listDropIndex=See which indexes a table has and remove one without blocking (PostgreSQL CONCURRENTLY).
devutils.sql.sheet.listDropIndex.when=Cleaning up unused or duplicate indexes to speed up writes.
devutils.sql.sheet.safeManualFix.title=Safe manual fix in production
devutils.sql.sheet.safeManualFix=Wrap the change in a transaction, check the affected row count, verify, then COMMIT. If anything looks wrong, ROLLBACK.
devutils.sql.sheet.safeManualFix.when=Every hand-written change on production data. Keep a backup copy and record the statement in the ticket.
devutils.sql.sheet.describeTable.title=Describe a table
devutils.sql.sheet.describeTable=List columns, types, nullability, and defaults with the standard information_schema.
devutils.sql.sheet.describeTable.when=Checking the real schema before writing a query or migration.
devutils.sql.sheet.activeQueries.title=Running queries (pg_stat_activity / PROCESSLIST)
devutils.sql.sheet.activeQueries=Show active sessions, how long their query has run, and what they wait for.
devutils.sql.sheet.activeQueries.when=The database is slow or connections are exhausted. "idle in transaction" sessions hold locks: fix the application code that leaves them open.
devutils.sql.sheet.cancelQuery.title=Cancel or kill a query
devutils.sql.sheet.cancelQuery=Cancel stops the current query; terminate closes the whole connection and rolls back its transaction.
devutils.sql.sheet.cancelQuery.when=A runaway query or a session blocking others. Try cancel first.
devutils.sql.sheet.statementTimeout.title=statement_timeout
devutils.sql.sheet.statementTimeout=Abort queries that run longer than the limit.
devutils.sql.sheet.statementTimeout.when=Protect production from runaway queries; set a role default for the application and a longer one for batch jobs.
devutils.sql.sheet.slowQueries.title=Slowest queries (pg_stat_statements)
devutils.sql.sheet.slowQueries=Top queries by total time. Needs the pg_stat_statements extension (PostgreSQL 13+ column names). MySQL: enable the slow query log or use performance_schema.
devutils.sql.sheet.slowQueries.when=Finding what to optimize first: high total time matters more than one slow call.
devutils.sql.sheet.tableSizes.title=Largest tables
devutils.sql.sheet.tableSizes=Total size including indexes and TOAST, with an approximate row count.
devutils.sql.sheet.tableSizes.when=Capacity planning, finding tables to partition or clean up.
devutils.sql.sheet.approxCount.title=Fast approximate row count
devutils.sql.sheet.approxCount=Read the planner's estimate instead of COUNT(*), which must scan the whole table in PostgreSQL and InnoDB.
devutils.sql.sheet.approxCount.when=Dashboards and pagination totals on huge tables where an exact number is not needed.
devutils.sql.sheet.unusedIndexes.title=Unused indexes
devutils.sql.sheet.unusedIndexes=Indexes that were never scanned since statistics were reset. They still cost disk and slow every write.
devutils.sql.sheet.unusedIndexes.when=Periodic cleanup. Check replicas too and keep indexes that back UNIQUE or primary keys.
devutils.sql.sheet.vacuum.title=VACUUM / OPTIMIZE TABLE
devutils.sql.sheet.vacuum=Reclaim space from dead rows and refresh statistics. Autovacuum normally does this; VACUUM FULL rewrites and locks the table.
devutils.sql.sheet.vacuum.when=After huge deletes or updates, or when autovacuum falls behind.
devutils.sql.sheet.readOnlyUser.title=Read-only user (GRANT)
devutils.sql.sheet.readOnlyUser=A login that can only read, including tables created later (ALTER DEFAULT PRIVILEGES).
devutils.sql.sheet.readOnlyUser.when=Reporting tools, analysts, and support access. Give applications only the rights they need.
devutils.sql.sheet.parameterized.title=Parameterized query (prevent SQL injection)
devutils.sql.sheet.parameterized=Send values separately from the SQL text; the database never treats them as code. Never concatenate user input into SQL.
devutils.sql.sheet.parameterized.when=Every query with input from users, files, or other systems. JDBC: PreparedStatement with setString / setLong.
devutils.sql.sheet.prepare.title=PREPARE / EXECUTE
devutils.sql.sheet.prepare=Server-side prepared statement: parsed once, run many times with different values.
devutils.sql.sheet.prepare.when=Testing parameterized SQL by hand. Drivers do this for you; with PgBouncer in transaction mode check driver settings.
devutils.sql.sheet.dynamicIdentifier.title=Dynamic table / column names
devutils.sql.sheet.dynamicIdentifier=Identifiers cannot be bound as parameters. Map input to a fixed allow-list in code; in PostgreSQL format('%I') quotes identifiers safely.
devutils.sql.sheet.dynamicIdentifier.when=User-selectable sort columns and multi-table tools.
devutils.sql.sheet.rowLevelSecurity.title=Row-level security (PostgreSQL)
devutils.sql.sheet.rowLevelSecurity=The database filters rows by policy for every query, so a missing WHERE tenant_id cannot leak another tenant's data. Table owners bypass it unless FORCE ROW LEVEL SECURITY is set.
devutils.sql.sheet.rowLevelSecurity.when=Multi-tenant SaaS with a shared schema. Use SET LOCAL inside a transaction with connection pools.

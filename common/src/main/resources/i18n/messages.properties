devutils.sql.name=SQL Formatter & Generator
devutils.sql.description=Format or minify multi-dialect SQL, generate INSERT/UPDATE/DELETE from Excel/CSV/TXT/JSON data, plus a syntax cheatsheet and guides to transactions, locking, EXPLAIN, partitioning, and sharding.
devutils.sql.hint=Formatter: paste SQL or drop a .sql file, then Format or Minify. Generator: upload .xlsx/.csv/.txt/.json data, pick PostgreSQL, Oracle, or MongoDB, then Generate. Cheatsheet: syntax with when to use it. Concepts: ACID, isolation, locking, deadlocks, EXPLAIN, normalization, partitioning, sharding. Everything runs locally.

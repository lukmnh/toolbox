name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: '21'
          java-package: jdk+fx
          cache: maven

      - name: Build & test
        run: ./mvnw -B clean package

      - name: jpackage app-image
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p staging
          cp -r app/target/toolbox-app.jar app/target/libs staging/
          # Runtime slim: hanya module yang benar-benar dipakai (hasil jdeps)
          MODS=$(jdeps -q --multi-release 21 --ignore-missing-deps --print-module-deps \
            --class-path "staging/libs/*" staging/toolbox-app.jar)
          jpackage --type app-image --name Toolbox --app-version "$VER" \
            --input staging --main-jar toolbox-app.jar \
            --main-class io.github.lukmnh.toolbox.app.Main \
            --add-modules "$MODS" \
            --jlink-options "--strip-debug --no-header-files --no-man-pages --strip-native-commands" \
            --dest dist
          echo "ZIP=Toolbox-${VER}-${{ matrix.platform }}.zip" >> "$GITHUB_ENV"

      - name: Zip (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip -qr "../$ZIP" Toolbox

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Toolbox -DestinationPath $env:ZIP

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: '21'
          java-package: jdk+fx
          cache: maven

      - name: Build & test
        run: ./mvnw -B clean package

      - name: jpackage app-image
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p staging
          cp -r app/target/toolbox-app.jar app/target/libs staging/
          # Runtime slim: hanya module yang benar-benar dipakai (hasil jdeps)
          MODS=$(jdeps -q --multi-release 21 --ignore-missing-deps --print-module-deps \
            --class-path "staging/libs/*" staging/toolbox-app.jar)
          jpackage --type app-image --name Toolbox --app-version "$VER" \
            --input staging --main-jar toolbox-app.jar \
            --main-class io.github.lukmnh.toolbox.app.Main \
            --add-modules "$MODS" \
            --jlink-options "--strip-debug --no-header-files --no-man-pages --strip-native-commands" \
            --dest dist
          echo "ASSET=Toolbox-${VER}-${{ matrix.platform }}.zip" >> "$GITHUB_ENV"

      - name: Add logs folder
        run: mkdir -p dist/Toolbox/logs

      - name: Zip (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip -qr "../$ASSET" Toolbox

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        # 7z, bukan Compress-Archive: Compress-Archive bisa melewatkan folder kosong
        run: cd dist && 7z a -tzip "../$ASSET" Toolbox

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          compression-level: 0

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: out/*.zip
          fail_on_unmatched_files: true
